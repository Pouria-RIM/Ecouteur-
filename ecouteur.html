<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Écouteur de Fréquence</title>
  <style>
    body { font-family: Arial; text-align: center; background: #111; color: #0f0; padding: 50px; }
    button { padding: 20px 40px; font-size: 24px; background: #222; color: #0f0; border: 2px solid #0f0; cursor: pointer; }
    #status { font-size: 26px; margin: 40px; min-height: 80px; }
  </style>
</head>
<body>
  <h1>Écoute pendant 3 secondes</h1>
  <p>Appuie sur le bouton, puis chante ou joue une note pendant 3 secondes</p>
  
  <button id="btn">🎤 COMMENCER L'ÉCOUTE (3s)</button>
  <div id="status">Prêt</div>

  <script>
    const btn = document.getElementById('btn');
    const status = document.getElementById('status');
    let audioContext;

    function detectPitch(buffer, sampleRate) {
      let best = -1, bestCorr = -1;
      const minO = Math.round(sampleRate / 1200);
      const maxO = Math.round(sampleRate / 60);

      for (let offset = minO; offset < maxO; offset++) {
        let corr = 0;
        for (let i = 0; i < buffer.length - offset; i++) {
          corr += buffer[i] * buffer[i + offset];
        }
        if (corr > bestCorr) {
          bestCorr = corr;
          best = offset;
        }
      }
      return best === -1 ? null : sampleRate / best;
    }

    btn.onclick = async () => {
      btn.disabled = true;
      status.textContent = "Écoute en cours... chante ou joue maintenant";

      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const analyser = audioContext.createAnalyser();
        analyser.fftSize = 4096;
        const source = audioContext.createMediaStreamSource(stream);
        source.connect(analyser);

        const data = new Float32Array(analyser.fftSize);

        setTimeout(() => {
          analyser.getFloatTimeDomainData(data);
          stream.getTracks().forEach(t => t.stop());

          const freq = detectPitch(data, audioContext.sampleRate);

          if (freq && freq > 60 && freq < 1500) {
            status.innerHTML = `Fréquence détectée : <b>${freq.toFixed(1)} Hz</b>`;
            playTone(freq);
          } else {
            status.textContent = "Aucune fréquence claire détectée. Essaie encore.";
          }
          btn.disabled = false;
        }, 3000);

      } catch(e) {
        status.textContent = "Erreur : Accès au micro refusé.";
        btn.disabled = false;
      }
    };

    function playTone(freq) {
      const now = audioContext.currentTime;
      const osc = audioContext.createOscillator();
      osc.type = 'sawtooth';
      osc.frequency.value = freq;

      const gain = audioContext.createGain();
      gain.gain.setValueAtTime(0.35, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 10);

      osc.connect(gain).connect(audioContext.destination);
      osc.start(now);
      osc.stop(now + 10);
    }
  </script>
</body>
</html>
